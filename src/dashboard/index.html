<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeaconOS</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- ─── Toast container ─── -->
  <div id="toast-container"></div>

  <!-- ─── Login page ─── -->
  <section id="page-login" class="page page-centered">
    <div class="login-card">
      <div class="login-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="url(#logo-grad)"/>
          <path d="M14 24L22 16L30 24L22 32L14 24Z" fill="#1a0a2e" opacity="0.8"/>
          <path d="M18 24L24 18L30 24L24 30L18 24Z" fill="#ff6b35"/>
          <circle cx="24" cy="24" r="3" fill="#1a0a2e"/>
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="48" y2="48">
              <stop stop-color="#a855f7"/><stop offset="1" stop-color="#6b21a8"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>BeaconOS</h1>
      <p class="login-subtitle">Server Management Platform</p>
      <div id="login-error" class="login-error"></div>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Username" autocomplete="username" required />
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required />
        <button type="submit" id="login-btn" class="btn btn-primary">Sign In</button>
      </form>
      <p class="login-hint">Default: <strong>admin</strong> (password shown on first launch)</p>
    </div>
  </section>

  <!-- ─── App shell ─── -->
  <div id="app-shell" class="app-shell hidden">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-brand">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="url(#logo-grad)"/>
          <path d="M18 24L24 18L30 24L24 30L18 24Z" fill="#ff6b35"/>
          <circle cx="24" cy="24" r="3" fill="#1a0a2e"/>
        </svg>
        <span>BeaconOS</span>
      </div>

      <div class="sidebar-nav">
        <a href="#/" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">&#9632;</span>
          <span>Dashboard</span>
        </a>
        <a href="#/servers" class="nav-item" data-page="servers">
          <span class="nav-icon">&#9733;</span>
          <span>Servers</span>
        </a>
        <a href="#/files" class="nav-item" data-page="files">
          <span class="nav-icon">&#128193;</span>
          <span>Files</span>
        </a>
        <a href="#/logs" class="nav-item" data-page="logs">
          <span class="nav-icon">&#9776;</span>
          <span>Logs</span>
        </a>
        <a href="#/settings" class="nav-item" data-page="settings">
          <span class="nav-icon">&#9881;</span>
          <span>Settings</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="nav-item" id="user-badge">
          <span class="nav-icon">&#9787;</span>
          <span id="sidebar-username">Loading...</span>
        </div>
        <a href="#" id="logout-link" class="nav-item">
          <span class="nav-icon">&#8592;</span>
          <span>Sign Out</span>
        </a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main-content">
      <section id="page-dashboard" class="page"></section>
      <section id="page-servers" class="page hidden"></section>
      <section id="page-files" class="page hidden"></section>
      <section id="page-logs" class="page hidden"></section>
      <section id="page-settings" class="page hidden"></section>
    </main>
  </div>

  <!-- ─── Scripts ─── -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/servers.js"></script>
  <script src="js/files.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
