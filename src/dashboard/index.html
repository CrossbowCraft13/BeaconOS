<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeaconOS Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  padding: 2rem;
  line-height: 1.6;
}
.container { max-width: 1200px; margin: 0 auto; }
h1 { font-size: 2.5rem; margin-bottom: 0.25rem; color: #38bdf8; }
.subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 1.1rem; }
.card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 0.75rem;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
}
.card h2 {
  font-size: 1.25rem;
  margin-bottom: 1rem;
  color: #f8fafc;
  border-bottom: 1px solid #334155;
  padding-bottom: 0.5rem;
}
.status-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}
.status-item {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 0.5rem;
  padding: 1rem;
}
.status-item .label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #64748b;
  margin-bottom: 0.25rem;
}
.status-item .value {
  font-size: 1rem;
  color: #f1f5f9;
  word-break: break-all;
}
.project-list { list-style: none; }
.project-item {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 0.5rem;
  padding: 1rem;
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: border-color 0.2s;
}
.project-item:hover { border-color: #38bdf8; }
.project-name {
  font-size: 1.1rem;
  font-weight: 600;
  color: #38bdf8;
}
.project-meta {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.badge {
  font-size: 0.75rem;
  padding: 0.2rem 0.5rem;
  border-radius: 9999px;
  background: #1e293b;
  color: #94a3b8;
  border: 1px solid #334155;
}
.badge.ok { background: #064e3b; color: #34d399; border-color: #059669; }
.badge.missing { background: #451a03; color: #fb923c; border-color: #ea580c; }
.no-projects {
  color: #94a3b8;
  font-style: italic;
  text-align: center;
  padding: 2rem;
}
.footer {
  text-align: center;
  color: #64748b;
  margin-top: 2rem;
  font-size: 0.875rem;
}
.footer a { color: #38bdf8; text-decoration: none; }
.footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>BeaconOS</h1>
  <p class="subtitle" id="subtitle">Loading...</p>

  <div class="card">
    <h2>System Status</h2>
    <div class="status-grid" id="status-grid">
      <div class="status-item"><div class="label">Loading...</div><div class="value">-</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Server Projects</h2>
    <ul class="project-list" id="project-list">
      <li class="no-projects">Loading projects...</li>
    </ul>
  </div>

  <div class="footer">
    <p>BeaconOS Dashboard — <a href="https://github.com/CrossbowCraft13/BeaconOS">GitHub</a></p>
  </div>
</div>

<script>
async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    document.getElementById('subtitle').textContent = `${data.app} ${data.version}`;
    const grid = document.getElementById('status-grid');
    grid.innerHTML = `
      <div class="status-item"><div class="label">App</div><div class="value">${data.app}</div></div>
      <div class="status-item"><div class="label">Version</div><div class="value">${data.version}</div></div>
      <div class="status-item"><div class="label">Node.js</div><div class="value">${data.nodeVersion}</div></div>
      <div class="status-item"><div class="label">Platform</div><div class="value">${data.platform}</div></div>
      <div class="status-item"><div class="label">Uptime</div><div class="value">${Math.floor(data.uptime)}s</div></div>
      <div class="status-item"><div class="label">Working Directory</div><div class="value">${data.cwd}</div></div>
      <div class="status-item"><div class="label">Timestamp</div><div class="value">${data.timestamp}</div></div>
    `;
  } catch (e) {
    document.getElementById('subtitle').textContent = 'Error loading status';
  }
}

async function loadProjects() {
  try {
    const res = await fetch('/api/projects');
    const data = await res.json();
    const list = document.getElementById('project-list');
    if (!data.projects || data.projects.length === 0) {
      list.innerHTML = '<li class="no-projects">No BeaconOS server projects found in the current directory.</li>';
      return;
    }
    list.innerHTML = data.projects.map(p => `
      <li class="project-item">
        <span class="project-name">${p.name}</span>
        <div class="project-meta">
          <span class="badge ${p.hasReadme ? 'ok' : 'missing'}">README</span>
          <span class="badge ${p.hasPlugins ? 'ok' : 'missing'}">Plugins</span>
          <span class="badge ${p.hasWorlds ? 'ok' : 'missing'}">Worlds</span>
          <span class="badge ${p.hasLogs ? 'ok' : 'missing'}">Logs</span>
          <span class="badge ${p.hasConfig ? 'ok' : 'missing'}">Config</span>
          <span class="badge ${p.hasCache ? 'ok' : 'missing'}">Cache</span>
        </div>
      </li>
    `).join('');
  } catch (e) {
    document.getElementById('project-list').innerHTML = '<li class="no-projects">Error loading projects.</li>';
  }
}

loadStatus();
loadProjects();
</script>
</body>
</html>
